<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#281b19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Cozy List"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.png"><title>My Cozy List V3</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4e6ce;background:#211817}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#30211e,#1b1515);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:24px 20px 10px;max-width:850px;margin:auto}h1,h2,h3{font-family:Georgia,serif}h1{font-size:32px;margin:4px 0}h2{font-size:23px;margin:6px 0 15px}.eyebrow{color:#d8b477;font-size:11px;letter-spacing:2px;text-transform:uppercase}.sub,.muted{color:#bca99a}.sub{font-size:13px}.shell{max-width:850px;margin:auto;padding:10px 16px 110px}.panel{background:#382924;border:1px solid #655044;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 4px 20px #0002}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:16px;background:#49342c;border-radius:12px;text-align:center}.tile strong{font:26px Georgia;display:block;color:#f1d29a}.btn{background:#b99561;color:#241916;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.btn.alt{background:#594038;color:#f3dfc0}.btn.outline{background:transparent;border:1px solid #a78b69;color:#efd8b4}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#261b19;border-top:1px solid #665041;padding:8px 4px max(9px,env(safe-area-inset-bottom));z-index:5}.nav button{width:20%;max-width:150px;border:0;background:none;color:#bba99b;font-size:11px;padding:6px 1px}.nav button.active{color:#f1ce93}.nav span{display:block;font-size:21px;margin-bottom:2px}.cover{width:74px;height:105px;object-fit:cover;border-radius:7px;background:#655044;flex-shrink:0}.cover.large{width:100px;height:145px}.placeholder{display:grid;place-items:center;color:#d2af7b;font-size:34px}.item{display:flex;gap:12px;border-bottom:1px solid #5d473b;padding:12px 0}.item:last-child{border:0}.item h3{margin:0 0 4px;font-size:16px}.tag{display:inline-block;background:#624538;color:#eed5ae;padding:4px 8px;border-radius:20px;font-size:11px;margin:4px 4px 4px 0}.bar{height:8px;border-radius:8px;background:#6a5145;overflow:hidden}.bar>div{height:100%;background:#d4ae71;transition:width .2s}input,select,textarea{background:#261b19;color:#f6e9d4;border:1px solid #796052;border-radius:9px;padding:11px;width:100%;margin:5px 0 10px}input[type=checkbox]{width:20px;height:20px;accent-color:#c49b62;margin:0}label{font-size:13px;color:#ead5b8}textarea{min-height:70px}.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.chip{border:1px solid #785f4e;border-radius:24px;padding:8px 12px;background:#3b2b25;color:#f0dbc0;white-space:nowrap}.chip.active{background:#b99561;color:#261a17}.stars{color:#f2c678;font-size:22px;letter-spacing:2px}.hint{font-size:12px;color:#bba99b;line-height:1.5}.empty{text-align:center;padding:30px 10px;color:#c7b4a2}.hidden{display:none!important}.toast{position:fixed;top:15px;left:10%;right:10%;background:#d7b77c;color:#261b19;padding:12px;border-radius:10px;text-align:center;z-index:20}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.line{border:0;border-top:1px solid #695042;margin:14px 0}.pill{border-radius:30px}.searchrow{display:flex;gap:8px}.searchrow input{margin:0;flex:1}.searchrow button{flex-shrink:0}small{font-size:11px}.wrap{flex-wrap:wrap}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.shell{padding-bottom:120px}}
</style></head><body><header><div class="eyebrow">✦ Ton refuge culturel</div><h1>My Cozy List</h1><div class="sub">Des histoires à collectionner, des univers à explorer · V3</div></header><main class="shell" id="app"></main><nav class="nav" id="nav"></nav><div id="toast" class="toast hidden"></div><script>
const STORE='mycozy_v3';let db=JSON.parse(localStorage.getItem(STORE)||'{"items":[],"lists":["Mes coups de cœur","À découvrir","Soirée cinéma"],"goal":20}');let page='home',kind='book',query='',results=[],activeId=null,filter='all',searching=false,searchError='',seriesFilter='all';
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(STORE,JSON.stringify(db));const toast=s=>{let el=$('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2800)};const pct=x=>x.status==='done'?100:x.type==='book'?(x.mode==='percent'?Number(x.progress||0):Math.round(100*Number(x.progress||0)/Math.max(1,Number(x.pages||1)))):0;const kinds={book:'Livres',movie:'Films',tv:'Séries'};const symbol={book:'📚',movie:'🎬',tv:'📺'};
const curated=[{keys:['harry potter'],type:'book',name:'Harry Potter',parts:['Harry Potter à l’école des sorciers','Harry Potter et la Chambre des secrets','Harry Potter et le Prisonnier d’Azkaban','Harry Potter et la Coupe de feu','Harry Potter et l’Ordre du Phénix','Harry Potter et le Prince de sang-mêlé','Harry Potter et les Reliques de la Mort']},{keys:['un palais d','a court of thorns','un palais de colère','un palais de cendres','un palais de glace','un palais de flammes'],type:'book',name:'Un palais d’épines et de roses',parts:['Un palais d’épines et de roses','Un palais de colère et de brume','Un palais de cendres et de ruines','Un palais de glace et de lumière','Un palais de flammes d’argent']},{keys:['hunger games','embrasement','révolte','ballade du serpent'],type:'book',name:'Hunger Games',parts:['Hunger Games','L’Embrasement','La Révolte','La Ballade du serpent et de l’oiseau chanteur','Lever de soleil sur la moisson']},{keys:['fourth wing','iron flame','onyx storm'],type:'book',name:'The Empyrean',parts:['Fourth Wing','Iron Flame','Onyx Storm']},{keys:['dune'],type:'book',name:'Dune',parts:['Dune','Le Messie de Dune','Les Enfants de Dune','L’Empereur-Dieu de Dune','Les Hérétiques de Dune','La Maison des mères']}];
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();const matches=(a,b)=>norm(a)===norm(b);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function seriesInfo(item){if(item.saga&&item.saga.parts?.length)return item.saga;const c=curated.find(c=>c.type===item.type&&c.keys.some(k=>norm(item.title).includes(norm(k))));return c?{name:c.name,parts:c.parts.map((title,i)=>({title,order:i+1}))}:null}
function ensureSaga(item){let s=seriesInfo(item);if(!s)return;item.saga=s;for(const p of s.parts){let existing=db.items.find(x=>x.type===item.type&&matches(x.title,p.title));if(existing){existing.saga=s;continue}db.items.push({id:uid(),type:item.type,title:p.title,status:'wish',rating:0,lists:[],saga:s,placeholder:true})}}
function nav(){const tabs=[['home','⌂','Accueil'],['library','▤','Bibliothèque'],['add','＋','Ajouter'],['sagas','◈','Sagas'],['me','✦','Mon univers']];$('nav').innerHTML=tabs.map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${t}</button>`).join('')}
function go(p){page=p;activeId=null;render();window.scrollTo(0,0)}function cover(x,large=false){return x.image?`<img class="cover ${large?'large':''}" loading="lazy" src="${safe(x.image)}" onerror="this.outerHTML='<div class=&quot;cover placeholder&quot;>${symbol[x.type]}</div>'">`:`<div class="cover placeholder ${large?'large':''}">${symbol[x.type]}</div>`}
function itemRow(x){return `<div class="item">${cover(x)}<div class="grow"><h3>${safe(x.title)}</h3><div class="hint">${safe(x.author||x.year||kinds[x.type])}</div><span class="tag">${x.status==='done'?'Terminé':x.status==='doing'?'En cours':'À découvrir'}</span>${x.type==='book'&&x.status==='doing'?`<div class="bar"><div style="width:${pct(x)}%"></div></div><small>${pct(x)} %</small>`:''}<div><button class="btn small alt" onclick="detail('${x.id}')">Voir la fiche</button></div></div></div>`}
function render(){nav();if(activeId){renderDetail();return}if(page==='home')home();else if(page==='library')library();else if(page==='add')add();else if(page==='sagas')sagas();else me()}
function home(){let done=db.items.filter(x=>x.status==='done'),books=done.filter(x=>x.type==='book').length;let current=db.items.filter(x=>x.status==='doing').slice(0,3);$('app').innerHTML=`<div class="panel"><div class="eyebrow">Bienvenue dans ton univers</div><h2>Chaque histoire compte ✨</h2><p class="muted">Retrouve tes lectures, tes films et tes séries en un seul endroit.</p><button class="btn" onclick="go('add')">＋ Découvrir un titre</button></div><div class="grid"><div class="tile">📖<strong>${books}</strong><small>Livres lus</small></div><div class="tile">🎬<strong>${done.filter(x=>x.type==='movie').length}</strong><small>Films vus</small></div><div class="tile">📺<strong>${done.filter(x=>x.type==='tv').length}</strong><small>Séries vues</small></div><div class="tile">✦<strong>${db.items.filter(x=>x.rating>=4).length}</strong><small>Coups de cœur</small></div></div><div class="panel"><h2>En ce moment</h2>${current.length?current.map(itemRow).join(''):'<div class="empty">Aucun titre en cours. Ajoute ta prochaine découverte !</div>'}</div><div class="panel"><h2>Envie d’une découverte ?</h2><p class="hint">Des suggestions à rechercher dans les catalogues, selon tes favoris et tes genres.</p><button class="btn alt" onclick="recommend()">✨ Me proposer des titres</button><div id="rec"></div></div>`}
function library(){let shown=db.items.filter(x=>(filter==='all'||x.type===filter)&&(!query||norm(x.title).includes(norm(query))));$('app').innerHTML=`<h2>Ma bibliothèque</h2><input placeholder="Filtrer ma collection…" value="${safe(query)}" oninput="query=this.value;library()"><div class="chips">${[['all','Tout'],['book','Livres'],['movie','Films'],['tv','Séries']].map(([k,v])=>`<button class="chip ${filter===k?'active':''}" onclick="filter='${k}';library()">${v}</button>`).join('')}</div><div class="panel">${shown.length?shown.map(itemRow).join(''):'<div class="empty">Ta bibliothèque est vide. Ajoute un titre avec le bouton +.</div>'}</div>`}
function add(){let ph=kind==='book'?'Titre, auteur ou ISBN':'Titre du film ou de la série';$('app').innerHTML=`<h2>Ajouter une découverte</h2><div class="chips">${Object.keys(kinds).map(k=>`<button class="chip ${kind===k?'active':''}" onclick="kind='${k}';results=[];searchError='';add()">${symbol[k]} ${kinds[k]}</button>`).join('')}</div><div class="panel"><label>Rechercher dans le catalogue</label><div class="searchrow"><input id="search" placeholder="${ph}" value="${safe(query)}" onkeydown="if(event.key==='Enter')lookup()"><button class="btn" onclick="lookup()">Chercher</button></div>${kind==='book'?`<div class="row wrap"><button class="btn small alt" onclick="scanISBN()">▣ Scanner un ISBN</button><span class="hint">Le scanner nécessite HTTPS et l'autorisation caméra.</span></div><div id="scanner"></div>`:''}<p class="hint">Les livres utilisent Open Library. Les films et séries utilisent TMDB via une fonction Netlify sécurisée.</p><button class="btn small outline" onclick="manual()">＋ Ajouter manuellement</button></div>${searching?'<div class="panel">Recherche en cours…</div>':''}${searchError?`<div class="panel">${safe(searchError)}</div>`:''}<div class="panel">${results.length?results.map((x,i)=>`<div class="item">${cover(x)}<div class="grow"><h3>${safe(x.title)}</h3><p class="hint">${safe(x.author||x.year||'')}</p><button class="btn small" onclick="choose(${i})">Ajouter</button></div></div>`).join(''):'<div class="empty">Les résultats de recherche apparaîtront ici.</div>'}</div>`}
async function lookup(){let val=$('search').value.trim();if(!val)return;query=val;searching=true;searchError='';results=[];add();try{if(kind==='book'){let url=/^\d{10,13}$/.test(val.replace(/[- ]/g,''))?`https://openlibrary.org/search.json?isbn=${encodeURIComponent(val.replace(/[- ]/g,''))}&limit=15`:`https://openlibrary.org/search.json?q=${encodeURIComponent(val)}&limit=15`;let r=await fetch(url);if(!r.ok)throw Error('Catalogue de livres indisponible');let d=await r.json();results=(d.docs||[]).map(b=>({type:'book',title:b.title,author:b.author_name?.[0]||'',pages:b.number_of_pages_median||0,image:b.cover_i?`https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg`:'',olKey:b.key,status:'wish',lists:[],rating:0}));}else{let r=await fetch(`/.netlify/functions/tmdb?mode=search&type=${kind}&q=${encodeURIComponent(val)}`);let d=await r.json();if(!r.ok)throw Error(d.error||'TMDB indisponible');results=(d.results||[]).map(b=>({type:kind,title:b.title||b.name,year:(b.release_date||b.first_air_date||'').slice(0,4),image:b.poster_path?`https://image.tmdb.org/t/p/w342${b.poster_path}`:'',tmdbId:b.id,status:'wish',lists:[],rating:0}));}if(!results.length)searchError='Aucun résultat trouvé. Essaie une autre orthographe ou ajoute le titre manuellement.'}catch(e){searchError=e.message}finally{searching=false;add()}}
async function choose(i){let x={...results[i],id:uid(),progress:0,mode:'percent'};let old=db.items.find(y=>y.type===x.type&&matches(y.title,x.title));if(old){Object.assign(old,{image:x.image||old.image,tmdbId:x.tmdbId||old.tmdbId,olKey:x.olKey||old.olKey,placeholder:false});x=old}else db.items.push(x);save();toast('Titre ajouté !');if(x.type==='movie'&&x.tmdbId){try{let r=await fetch(`/.netlify/functions/tmdb?mode=movie&id=${x.tmdbId}`);if(r.ok){let d=await r.json();if(d.collection?.parts?.length){x.saga=d.collection;ensureSaga(x);save();toast('Saga cinéma ajoutée automatiquement !')}}}catch(e){}}else if(x.type==='book'){ensureSaga(x);save()}detail(x.id)}
function manual(){let title=prompt('Titre à ajouter :');if(!title?.trim())return;let x={id:uid(),type:kind,title:title.trim(),status:'wish',lists:[],rating:0,progress:0,mode:'percent'};db.items.push(x);ensureSaga(x);save();detail(x.id)}
function detail(id){activeId=id;render();window.scrollTo(0,0)}function renderDetail(){let x=db.items.find(y=>y.id===activeId);if(!x){activeId=null;render();return}let p=pct(x);$('app').innerHTML=`<button class="btn small outline" onclick="activeId=null;render()">← Retour</button><div class="panel" style="margin-top:12px"><div class="row">${cover(x,true)}<div class="grow"><h2>${safe(x.title)}</h2><p class="hint">${safe(x.author||x.year||kinds[x.type])}</p>${x.saga?`<span class="tag">Saga : ${safe(x.saga.name)}</span>`:''}</div></div><hr class="line"><label>Statut</label><select id="status" onchange="updateItem('${x.id}','status',this.value)"><option value="wish" ${x.status==='wish'?'selected':''}>À découvrir</option><option value="doing" ${x.status==='doing'?'selected':''}>En cours</option><option value="done" ${x.status==='done'?'selected':''}>Terminé</option></select>${x.type==='book'?`<div class="two"><div><label>Suivi</label><select id="mode" onchange="updateItem('${x.id}','mode',this.value)"><option value="percent" ${x.mode!=='pages'?'selected':''}>Kindle (%)</option><option value="pages" ${x.mode==='pages'?'selected':''}>Pages</option></select></div><div><label>${x.mode==='pages'?'Page actuelle':'Progression (%)'}</label><input type="number" min="0" max="${x.mode==='pages'?99999:100}" value="${Number(x.progress||0)}" onchange="updateItem('${x.id}','progress',Number(this.value))"></div></div>${x.mode==='pages'?`<label>Nombre total de pages</label><input type="number" min="1" value="${Number(x.pages||0)}" onchange="updateItem('${x.id}','pages',Number(this.value))">`:''}<div class="bar"><div style="width:${p}%"></div></div><p class="hint">${p}% terminé</p>`:''}<label>Ma note</label><select onchange="updateItem('${x.id}','rating',Number(this.value))"><option value="0">Pas encore noté</option>${Array.from({length:10},(_,i)=>(i+1)/2).map(n=>`<option value="${n}" ${x.rating===n?'selected':''}>${n} / 5 ★</option>`).join('')}</select><label>Mon avis</label><textarea onchange="updateItem('${x.id}','review',this.value)" placeholder="Ce que j'en ai pensé…">${safe(x.review||'')}</textarea><label>Mes listes</label>${db.lists.map(l=>`<div class="row" style="margin:9px 0"><input type="checkbox" ${x.lists?.includes(l)?'checked':''} onchange="toggleList('${x.id}',${JSON.stringify(l).replace(/"/g,'&quot;')},this.checked)"><span>${safe(l)}</span></div>`).join('')}<hr class="line"><button class="btn small alt" onclick="attachSaga('${x.id}')">◈ Associer à une saga</button> <button class="btn small outline" onclick="removeItem('${x.id}')">Supprimer</button></div>`}
function updateItem(id,key,val){let x=db.items.find(y=>y.id===id);if(!x)return;x[key]=val;if(key==='status'&&val==='done'&&x.type==='book'){x.progress=x.mode==='pages'?x.pages||0:100}save();renderDetail()}
function toggleList(id,l,checked){let x=db.items.find(y=>y.id===id);x.lists=x.lists||[];x.lists=checked?[...new Set([...x.lists,l])]:x.lists.filter(v=>v!==l);save()}
function removeItem(id){if(!confirm('Supprimer ce titre de ta bibliothèque ?'))return;db.items=db.items.filter(x=>x.id!==id);save();activeId=null;render()}
function attachSaga(id){let x=db.items.find(y=>y.id===id);let name=prompt('Nom de la saga :',x.saga?.name||'');if(!name?.trim())return;let titles=prompt('Titres dans l’ordre (un par ligne). Tu peux ajouter les autres tomes ou films :',x.saga?.parts?.map(p=>p.title).join('\n')||x.title);if(!titles)return;x.saga={name:name.trim(),parts:titles.split('\n').map((s,i)=>({title:s.trim(),order:i+1})).filter(p=>p.title)};ensureSaga(x);save();renderDetail();toast('Saga créée !')}
function sagas(){let map=new Map();for(let x of db.items){if(x.saga?.parts?.length){let key=x.type+'|'+x.saga.name;if(!map.has(key))map.set(key,{...x.saga,type:x.type});}}let all=[...map.values()].filter(s=>seriesFilter==='all'||s.type===seriesFilter);$('app').innerHTML=`<h2>Mes sagas ◈</h2><p class="hint">Coche chaque titre terminé. Les sagas reconnues s'ajoutent automatiquement.</p><div class="chips">${[['all','Toutes'],['book','Livres'],['movie','Films']].map(([k,t])=>`<button class="chip ${seriesFilter===k?'active':''}" onclick="seriesFilter='${k}';sagas()">${t}</button>`).join('')}</div>${all.length?all.map((s,i)=>{let done=s.parts.filter(p=>db.items.some(x=>x.type===s.type&&matches(x.title,p.title)&&x.status==='done')).length;return `<div class="panel"><h3>${safe(s.name)}</h3><p class="hint">${done} / ${s.parts.length} ${s.type==='book'?'tomes lus':'films vus'}</p><div class="bar"><div style="width:${Math.round(done/s.parts.length*100)}%"></div></div>${s.parts.map(p=>{let x=db.items.find(x=>x.type===s.type&&matches(x.title,p.title));return `<div class="row" style="margin-top:12px"><input type="checkbox" ${x?.status==='done'?'checked':''} onchange="checkSaga('${safe(s.type)}','${safe(s.name).replace(/'/g,'&#39;')}',${p.order},this.checked)"><div class="grow"><div>${p.order}. ${safe(p.title)}</div><small class="muted">${x?.status==='done'?'Terminé':'À découvrir'}</small></div>${x?`<button class="btn small alt" onclick="detail('${x.id}')">Fiche</button>`:''}</div>`}).join('')}</div>`}).join(''):'<div class="panel empty">Aucune saga pour le moment. Recherche un titre d’une saga connue ou associe-en une depuis sa fiche.</div>'}`}
function checkSaga(type,name,order,checked){let s=db.items.find(x=>x.type===type&&x.saga?.name===name)?.saga;if(!s)return;let p=s.parts.find(p=>p.order===order),x=db.items.find(x=>x.type===type&&matches(x.title,p.title));if(!x){x={id:uid(),type,title:p.title,lists:[],rating:0,saga:s};db.items.push(x)}x.status=checked?'done':'wish';save();sagas()}
function me(){$('app').innerHTML=`<h2>Mon univers ✦</h2><div class="panel"><h3>Objectif de lecture</h3><p>${db.items.filter(x=>x.type==='book'&&x.status==='done').length} livres terminés sur <input style="width:75px;display:inline" type="number" min="1" value="${db.goal}" onchange="db.goal=Number(this.value);save()"> prévus</p><div class="bar"><div style="width:${Math.min(100,100*db.items.filter(x=>x.type==='book'&&x.status==='done').length/(db.goal||1))}%"></div></div></div><div class="panel"><h3>Mes listes</h3>${db.lists.map(l=>`<div class="row between" style="padding:8px 0"><span>${safe(l)} (${db.items.filter(x=>x.lists?.includes(l)).length})</span><button class="btn small alt" onclick="showList(${JSON.stringify(l).replace(/"/g,'&quot;')})">Ouvrir</button></div>`).join('')}<button class="btn" onclick="newList()">＋ Créer une liste</button></div><div class="panel"><h3>Sauvegarde</h3><p class="hint">Tes données sont enregistrées sur cet appareil. Exporte-les régulièrement avant de changer de téléphone ou de site.</p><button class="btn alt" onclick="exportData()">Exporter mes données</button> <button class="btn outline" onclick="$('importfile').click()">Importer</button><input id="importfile" type="file" accept="application/json" style="display:none" onchange="importData(this)"></div><div class="panel"><p class="hint">My Cozy List V3 · Les sagas de livres sont reconnues pour une sélection de collections. Les collections de films viennent de TMDB lorsque disponibles. Une saga inconnue peut être créée manuellement.</p></div>`}
function showList(l){let items=db.items.filter(x=>x.lists?.includes(l));$('app').innerHTML=`<button class="btn small outline" onclick="me()">← Mes listes</button><h2>${safe(l)}</h2><div class="panel">${items.length?items.map(itemRow).join(''):'<div class="empty">Cette liste est vide.</div>'}</div>`}
function newList(){let name=prompt('Nom de ta nouvelle liste :');if(!name?.trim()||db.lists.includes(name.trim()))return;db.lists.push(name.trim());save();me()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-cozy-list-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
async function importData(input){try{let d=JSON.parse(await input.files[0].text());if(!Array.isArray(d.items)||!Array.isArray(d.lists))throw Error('Fichier incorrect');if(confirm('Remplacer la bibliothèque actuelle par cette sauvegarde ?')){db=d;save();me();toast('Sauvegarde importée')}}catch(e){toast('Fichier de sauvegarde invalide')}}
async function recommend(){let top=db.items.filter(x=>x.rating>=4).map(x=>x.title);let suggestions=top.length?top.slice(0,3):['fantasy romantasy','mystère','science-fiction'];$('rec').innerHTML=`<p class="hint">Suggestions de recherches inspirées de tes favoris : ${suggestions.map(s=>safe(s)).join(' · ')}</p><button class="btn small" onclick="kind='book';query='fantasy';go('add');lookupFromRecommendation()">📚 Explorer des livres</button> <button class="btn small alt" onclick="kind='movie';query='fantasy';go('add');lookupFromRecommendation()">🎬 Explorer des films</button> <button class="btn small alt" onclick="kind='tv';query='drama';go('add');lookupFromRecommendation()">📺 Explorer des séries</button>`}
function lookupFromRecommendation(){setTimeout(()=>{$('search').value=query;lookup()},50)}
async function scanISBN(){const host=$('scanner');host.innerHTML='<p class="hint">Ouverture de la caméra…</p>';if(!('BarcodeDetector'in window)){host.innerHTML='<p class="hint">Scanner non disponible dans ce navigateur. Saisis les 13 chiffres du code-barres dans la recherche.</p>';return}let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});host.innerHTML='<video id="video" autoplay playsinline style="width:100%;border-radius:12px"></video><button class="btn small" onclick="stopScan()">Arrêter le scan</button>';let video=$('video');video.srcObject=stream;window.scanStream=stream;let detector=new BarcodeDetector({formats:['ean_13','ean_8']});window.scanTimer=setInterval(async()=>{if(video.readyState<2)return;let codes=await detector.detect(video);if(codes.length){let isbn=codes[0].rawValue;stopScan();$('search').value=isbn;lookup()}},650)}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());host.innerHTML='<p class="hint">Impossible d’accéder à la caméra. Tu peux saisir le code ISBN manuellement.</p>'}}
function stopScan(){clearInterval(window.scanTimer);window.scanStream?.getTracks().forEach(t=>t.stop());if($('scanner'))$('scanner').innerHTML=''}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
